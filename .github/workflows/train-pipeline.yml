name: Train and export Titanic pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pipeline_titanic.py"
      - "titanic.csv"
      - ".github/workflows/train-pipeline.yml"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn joblib

      - name: Train and export pipeline
        run: python pipeline_titanic.py

      - name: Commit exported model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add titanic_pipeline.pkl
          git commit -m "Add trained Titanic pipeline" || echo "No model changes to commit"
          git push
